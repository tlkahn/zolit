[package]
name = "zolit"
version = "0.1.0"
edition = "2021"
description = "Standalone CLI for exporting Zotero annotations into Lit-flavored markdown"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.35", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
strsim = "0.11"
walkdir = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
colored = "3"
chrono = { version = "0.4", features = ["clock", "std"] }

[dependencies.reqwest]
version = "0.12"
features = ["rustls-tls", "json"]
optional = true

[dependencies.tokio]
version = "1"
features = ["rt", "macros"]
optional = true

[dev-dependencies]
tempfile = "3"

[features]
default = []
llm = ["reqwest", "tokio"]
